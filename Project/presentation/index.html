<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FYRE Project Presentation</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .topbar {
        background: var(--panel);
        border-bottom: 1px solid rgba(255,255,255,0.08);
        padding: 0.75rem 1rem;
        font-size: 0.95rem;
      }
      .frame-wrap {
        flex: 1;
        min-height: 0;
        padding: 0;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="topbar">FYRE Project Presentation — live Google Slides view</div>
    <div class="frame-wrap">
      <iframe
        src="https://docs.google.com/presentation/d/1cw1ogNTkIDFV3vP-RiPaUlmFpllacj3x38Kxiv_WeeI/embed?start=false&loop=false&delayms=3000"
        allowfullscreen="true"
        mozallowfullscreen="true"
        webkitallowfullscreen="true"
        title="Google Slides presentation"
      ></iframe>
    </div>
  </body>
</html>
