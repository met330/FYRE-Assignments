<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FYRE Project Presentation</title>
    <style>
      :root {
        --bg: #111827;
        --panel: #1f2937;
        --text: #e5e7eb;
        --button: #2563eb;
        --button-hover: #1d4ed8;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: var(--panel);
        border-radius: 16px;
        padding: 2rem 2.5rem;
        text-align: center;
        box-shadow: 0 12px 32px rgba(0,0,0,0.28);
        max-width: 560px;
        width: calc(100% - 32px);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.8rem, 3vw, 2.5rem);
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.6;
        color: #d1d5db;
      }
      a.button {
        display: inline-block;
        background: var(--button);
        color: white;
        text-decoration: none;
        padding: 0.9rem 1.5rem;
        border-radius: 10px;
        font-weight: 700;
        transition: background 0.2s ease;
      }
      a.button:hover {
        background: var(--button-hover);
      }
      .link {
        margin-top: 1rem;
        display: block;
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>FYRE Project Presentation</h1>
      <p>
        This opens the actual live Google Slides presentation so all images, GIFs,
        and slide content stay in sync with the deck you are editing.
      </p>
      <a class="button" href="https://redesigned-goldfish-vpqj47pw4qxxh6xp5-8000.app.github.dev/Project/presentation/" target="_blank" rel="noopener noreferrer">
        Open Presentation
      </a>
      <a class="link" href="https://docs.google.com/presentation/d/1cw1ogNTkIDFV3vP-RiPaUlmFpllacj3x38Kxiv_WeeI" target="_blank" rel="noopener noreferrer">
        Open in Google Slides
      </a>
    </div>
  </body>
</html>
